
stages:
  - test
  - release

# Build Send, run npm tests
test:
  stage: test
  image: "node:24-bookworm-slim"
  only:
    - api
    - branches
    - chat
    - merge_requests
    - pushes
    - schedules
    - tags
    - triggers
    - web
  before_script:
    # Install dependencies
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential
        ca-certificates
        fonts-liberation
        git
        libasound2
        libatk-bridge2.0-0
        libatk1.0-0
        libc6
        libcairo2
        libcups2
        libdbus-1-3
        libdrm2
        libexpat1
        libgbm1
        libglib2.0-0
        libgtk-3-0
        libnspr4
        libnss3
        libpango-1.0-0
        libu2f-udev
        libvulkan1
        libxshmfence1
        libx11-6
        libx11-xcb1
        libxcb1
        libxcomposite1
        libxdamage1
        libxext6
        libxfixes3
        libxrandr2
        python3
        xdg-utils
  script:
    - npm run check:runtime
    - npm ci
    - npm run lint
    - npm test

release-docker:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  only:
    - tags
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name sendBuilder
    - docker buildx use sendBuilder
    - |
      IMAGE_NAMES="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_REGISTRY_IMAGE:latest"
    - |
      for image in $IMAGE_NAMES; do
        docker buildx build --platform linux/amd64,linux/arm64 -t $image . --push
      done
    - |
      echo "Container image pushed. You can pull it with";
      for image in $IMAGE_NAMES; do
        echo "docker pull $image"
      done
